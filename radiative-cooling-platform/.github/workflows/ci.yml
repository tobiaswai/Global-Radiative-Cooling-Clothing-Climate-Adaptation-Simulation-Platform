name: Platform CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  # 允許在 GitHub Actions 頁面手動執行
  workflow_dispatch:

# 同一分支有新提交時，取消舊的執行
concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: radiative_cooling_test
          POSTGRES_USER: rc_user
          POSTGRES_PASSWORD: rc_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U rc_user -d radiative_cooling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: Radiative Cooling Simulation API
      APP_ENV: test

      DATABASE_URL: >-
        postgresql+psycopg://rc_user:rc_password@localhost:5432/radiative_cooling_test

      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

      FRONTEND_ORIGIN: http://localhost:3000

      PYTHONPATH: ${{ github.workspace }}/backend

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Check Alembic model consistency
        run: |
          alembic check

      - name: Run backend tests
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=75

      - name: Check backend imports
        run: |
          python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show Node.js version
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint

      - name: Build Next.js application
        run: |
          npm run build

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    if: always()

    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend job failed."
            exit 1
          fi

          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend job failed."
            exit 1
          fi

          echo "All CI checks passed."